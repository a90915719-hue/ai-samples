<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>390px 미리보기(임시 검수용)</title>
<style>
  html,body{margin:0;background:#222}
  .frame{width:390px;height:1700px;border:0;display:block;background:#fff;transform-origin:top left;transform:scale(2)}
  .box{width:780px;height:3400px;overflow:hidden}
</style>
</head>
<body>
<div class="box"><iframe class="frame" id="f"></iframe></div>
<script>
  var m = location.search.match(/c=(c\d\d)/);
  document.getElementById('f').src = './' + (m ? m[1] : 'c01') + '/';
</script>
</body>
</html>
